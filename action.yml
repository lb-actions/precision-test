name: 'Precision Test Selector'
description: 'Coverage-based precision test selector with line, function, and file granularity'
author: 'openlibing'

inputs:
  repo:
    description: 'Repository adapter identifier consumed by the bundled test_selector package (e.g. vllm_ascend / sglang / sglang-kernel / pytorch / torch_npu). Any adapter identifier supported by the bundled package is accepted (default: vllm_ascend); adapting a new repository only requires a test_selector update, no action change'
    required: false
    default: 'vllm_ascend'
  github-pr:
    description: 'GitHub PR, format: owner/repo#pr_number (for vllm_ascend / sglang / sglang-kernel / pytorch; pytorch uses upstream pytorch/pytorch#N)'
    required: false
  gitcode-pr:
    description: 'GitCode PR, format: owner/repo#pr_number (used by torch_npu for Ascend/pytorch); mutually exclusive with github-pr'
    required: false
  source-dir:
    description: 'Source code directory (default: covstub)'
    required: false
    default: 'covstub'
  map-file:
    description: 'Test case map file (default: test_case_map.json)'
    required: false
    default: 'test_case_map.json'
  coverage-dir:
    description: 'Coverage data directory, required only when building the map (default: coverage)'
    required: false
    default: 'coverage'
  build-map:
    description: 'Rebuild test case mapping'
    required: false
    default: 'false'
  min-affected:
    description: 'Minimum affected lines threshold (default: 1)'
    required: false
    default: '1'
  dedup:
    description: 'Enable deduplication (keep only one test for same covered lines)'
    required: false
    default: 'false'
  enable-line-match:
    description: 'Enable line-level matching'
    required: false
    default: 'true'
  enable-function-match:
    description: 'Enable function-level matching'
    required: false
    default: 'true'
  skip-imports:
    description: 'Skip import statement lines (only effective for function-level matching)'
    required: false
    default: 'false'
  operator-repo-root:
    description: 'sgl-kernel-npu repository root for real-time csrc operator mapping (contains csrc/, python/sgl_kernel_npu/, tests/python/). Required only when repo=sglang-kernel and the PR contains non-Markdown csrc/ changes'
    required: false
  coverage-tar-path:
    description: 'Coverage tar package path; when provided: upload to OBS, rebuild test case map from it, upload the map and reset the append table'
    required: false
  download-coverage:
    description: 'Download the coverage tar and test case map from OBS ({chip-type}/{project-name} directory, previously uploaded via coverage-tar-path) and auto-fill source-dir / map-file / coverage-dir; lets callers pass github-pr only. Any download failure fails the run. Mutually exclusive with coverage-tar-path and build-map'
    required: false
    default: 'false'
  append-on-merge:
    description: 'Append the new test cases of this PR to the OBS append table (run on PR merge event; requires github-pr or gitcode-pr). Ignored for sglang'
    required: false
    default: 'false'
  enable-append-table:
    description: 'Merge the OBS append table into the recommended test list (default: false). Requires obs-bucket-name and oidc-config. Ignored for sglang'
    required: false
    default: 'false'
  project-name:
    description: 'Project name segment of the OBS path (e.g. MindIE-LLM, vllm-ascend); defaults to the current repository name'
    required: false
  chip-type:
    description: 'Chip type segment of the OBS path (default: Ascend)'
    required: false
    default: 'Ascend'
  obs-bucket-name:
    description: 'OBS bucket for coverage tar / map / append table. Required when any OBS-backed feature is used (coverage-tar-path / download-coverage / append-on-merge / enable-append-table); no default bucket'
    required: false
  oidc-config:
    description: 'OIDC client config JSON for the OBS account, provided by the business side (e.g. {"accountId":"...","region":"cn-southwest-2"}). Required when any OBS-backed feature is used; no default account'
    required: false

outputs:
  upload-success:
    description: 'Whether the coverage tar / map upload succeeded (set only when coverage-tar-path is provided)'
  obs-url:
    description: 'Public OBS URL of the uploaded coverage tar (set only when upload succeeded)'

runs:
  using: 'node20'
  main: 'dist/index.js'
