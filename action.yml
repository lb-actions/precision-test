name: 'Precision Test Selector'
description: 'Coverage-based precision test selector with line, function, and file granularity'
author: 'openlibing'

inputs:
  repo:
    description: 'Repository adapter: vllm_ascend / sglang / torch_npu (default: vllm_ascend)'
    required: false
    default: 'vllm_ascend'
  github-pr:
    description: 'GitHub PR, format: owner/repo#pr_number (for vllm_ascend / sglang)'
    required: false
  gitcode-pr:
    description: 'GitCode PR, format: owner/repo#pr_number (for torch_npu); mutually exclusive with github-pr'
    required: false
  source-dir:
    description: 'Source code directory (default: covstub)'
    required: false
    default: 'covstub'
  map-file:
    description: 'Test case map file (default: test_case_map.json)'
    required: false
    default: 'test_case_map.json'
  coverage-dir:
    description: 'Coverage data directory, required only when building the map (default: coverage)'
    required: false
    default: 'coverage'
  build-map:
    description: 'Rebuild test case mapping'
    required: false
    default: 'false'
  min-affected:
    description: 'Minimum affected lines threshold (default: 1)'
    required: false
    default: '1'
  dedup:
    description: 'Enable deduplication (keep only one test for same covered lines)'
    required: false
    default: 'false'
  enable-line-match:
    description: 'Enable line-level matching'
    required: false
    default: 'true'
  enable-function-match:
    description: 'Enable function-level matching'
    required: false
    default: 'true'
  skip-imports:
    description: 'Skip import statement lines (only effective for function-level matching)'
    required: false
    default: 'false'

runs:
  using: 'node20'
  main: 'dist/index.js'
